; ESP32-2432S028 "Cheap Yellow Display" รุ่น 2USB (USB-C + micro-USB)
; จอ ILI9341 240x320 (SPI/HSPI) + จอสัมผัส resistive XPT2046 (SPI/VSPI)

[platformio]
default_envs = cyd2usb

[env:cyd2usb]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    bblanchon/ArduinoJson@7.2.1

build_flags =
    ; --- TFT_eSPI config (แทน User_Setup.h) ---
    -DUSER_SETUP_LOADED=1
    ; ยืนยันจาก log เฟิร์มแวร์เดิม: ILI9341, HSPI MOSI13/SCLK14/CS15, 40MHz, MADCTL 0xE8
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
